<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shellGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a9a6a;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4a7a4a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Water bubble background -->
  <circle id="water-bubble" cx="100" cy="100" r="95" fill="#d6eef5" opacity="0.5"/>

  <!-- Turtle body -->
  <ellipse id="body" cx="100" cy="115" rx="45" ry="35" fill="#a8d88a" stroke="#7ab860" stroke-width="1.5"/>

  <!-- Belly patch -->
  <ellipse id="belly" cx="100" cy="118" rx="28" ry="22" fill="#c8e8a8" opacity="0.6"/>

  <!-- Shell -->
  <ellipse id="shell" cx="100" cy="98" rx="42" ry="33" fill="#5a8a5a" stroke="#3d6b3d" stroke-width="1.5"/>

  <!-- Shell hexagon pattern -->
  <g id="shell-pattern" opacity="0.5">
    <!-- Center hexagon -->
    <polygon points="100,78 110,83 110,93 100,98 90,93 90,83" fill="#4a7a4a"/>
    <!-- Top hexagon -->
    <polygon points="100,63 110,68 110,78 100,83 90,78 90,68" fill="#4a7a4a"/>
    <!-- Top-right -->
    <polygon points="115,73 125,78 125,88 115,93 105,88 105,78" fill="#4a7a4a"/>
    <!-- Bottom-right -->
    <polygon points="115,93 125,98 125,108 115,113 105,108 105,98" fill="#4a7a4a"/>
    <!-- Bottom -->
    <polygon points="100,113 110,118 110,128 100,133 90,128 90,118" fill="#4a7a4a"/>
    <!-- Bottom-left -->
    <polygon points="85,93 95,98 95,108 85,113 75,108 75,98" fill="#4a7a4a"/>
    <!-- Top-left -->
    <polygon points="85,73 95,78 95,88 85,93 75,88 75,78" fill="#4a7a4a"/>
  </g>

  <!-- Shell W marking -->
  <path id="shell-marking" d="M 100 75 L 92 90 L 100 85 L 108 90" fill="none" stroke="#6a9a6a" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

  <!-- Head -->
  <circle id="head" cx="100" cy="68" r="20" fill="#a8d88a" stroke="#7ab860" stroke-width="1.5"/>

  <!-- Head spots -->
  <circle cx="92" cy="62" r="2" fill="#8bc870" opacity="0.5"/>
  <circle cx="100" cy="58" r="2" fill="#8bc870" opacity="0.5"/>
  <circle cx="108" cy="62" r="2" fill="#8bc870" opacity="0.5"/>

  <!-- Eyes -->
  <circle id="eye-left" cx="93" cy="63" r="3.5" fill="#1a3a1a"/>
  <circle id="eye-left-highlight" cx="94" cy="62" r="1" fill="white"/>

  <circle id="eye-right" cx="107" cy="63" r="3.5" fill="#1a3a1a"/>
  <circle id="eye-right-highlight" cx="108" cy="62" r="1" fill="white"/>

  <!-- Smile -->
  <path id="smile" d="M 88 72 Q 100 80 112 72" fill="none" stroke="#2c4a2c" stroke-width="2" stroke-linecap="round"/>

  <!-- Front-left flipper -->
  <ellipse id="flipper-fl" cx="62" cy="100" rx="12" ry="8" fill="#8bc870" stroke="#7ab860" stroke-width="1" transform="rotate(-35 62 100)"/>

  <!-- Front-right flipper -->
  <ellipse id="flipper-fr" cx="138" cy="100" rx="12" ry="8" fill="#8bc870" stroke="#7ab860" stroke-width="1" transform="rotate(35 138 100)"/>

  <!-- Back-left flipper -->
  <ellipse id="flipper-bl" cx="70" cy="138" rx="12" ry="8" fill="#8bc870" stroke="#7ab860" stroke-width="1" transform="rotate(25 70 138)"/>

  <!-- Back-right flipper -->
  <ellipse id="flipper-br" cx="130" cy="138" rx="12" ry="8" fill="#8bc870" stroke="#7ab860" stroke-width="1" transform="rotate(-25 130 138)"/>

  <!-- Text: KACHUA -->
  <text x="100" y="165" font-family="Cinzel, serif" font-size="18" fill="#3d6b3d" text-anchor="middle" letter-spacing="4">KACHUA</text>

  <!-- Subtext -->
  <text x="100" y="182" font-family="Inter, sans-serif" font-size="11" fill="#5a8a5a" text-anchor="middle" letter-spacing="2">WE'RE THERE FOR YOU</text>
</svg>
